name: Deploy Backend (NestJS)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 9002
          script: |
            # Server prerequisites:
            #   - Node.js >= 20 (NestJS 11 requirement)
            #   - A `.env` file in this dir with DATABASE_URL, JWT_SECRET,
            #     BASIC_AUTH_*, PUBLIC_FRONTEND_URL, MAIL_*, MINIO_*/AWS_REGION
            #   - PM2 process named `backend-expo` already created, e.g.
            #     `pm2 start dist/src/main.js --name backend-expo`
            cd /home/dev-backend-expo
            git pull origin main
            npm install
            npx prisma migrate deploy
            npm run build
            pm2 restart backend-expo
