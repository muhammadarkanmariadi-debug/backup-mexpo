name: Build Checks & Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # 1. Backend Build & Type Check
  # ============================================================
  check-backend:
    name: Check Backend (NestJS + Prisma)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dev-backend-mexpo-new/package-lock.json

      - name: Install Backend Dependencies
        working-directory: dev-backend-mexpo-new
        run: npm ci

      - name: Generate Prisma Client
        working-directory: dev-backend-mexpo-new
        run: npx prisma generate

      - name: Build NestJS Application
        working-directory: dev-backend-mexpo-new
        run: npm run build

  # ============================================================
  # 2. Frontend Build & Type Check
  # ============================================================
  check-frontend:
    name: Check Frontend (Next.js 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dev-frontend-mexpo-new/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: dev-frontend-mexpo-new
        run: npm ci

      - name: Build Next.js Application
        working-directory: dev-frontend-mexpo-new
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_BASE_URL_PRODUCTION: http://localhost:3500
          NEXT_PUBLIC_BASE_URL_DEVELOPMENT: http://localhost:3500
          NEXT_PUBLIC_BASIC_AUTH_USERNAME: dummy
          NEXT_PUBLIC_BASIC_AUTH_PASSWORD: dummy
          NEXT_PUBLIC_TOKEN_KEY: mexpo-token
        run: npm run build

  # ============================================================
  # 3. Deploy to EC2 (Only runs when both checks succeed on main)
  # ============================================================
  deploy:
    name: Deploy to EC2
    needs: [check-backend, check-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            # Target directory on EC2
            TARGET_DIR="$HOME/backup-mexpo"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "📂 Ensuring target directory exists: $TARGET_DIR"
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "🚀 Repository not found at $TARGET_DIR. Cloning..."
              mkdir -p "$TARGET_DIR"
              git clone "$REPO_URL" "$TARGET_DIR"
              cd "$TARGET_DIR"
            else
              echo "📍 Repository exists at $TARGET_DIR. Navigating..."
              cd "$TARGET_DIR"
              git remote set-url origin "$REPO_URL"
            fi

            echo "🔒 Setting Git safe directory..."
            git config --global --add safe.directory "$TARGET_DIR"

            echo "📥 Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            # Check if docker compose exists
            if command -v docker &> /dev/null && [ -f "docker-compose.yml" ]; then
              echo "🐳 Deploying via Docker Compose..."
              docker compose up -d --build --remove-orphans
              
              echo "🧹 Cleaning up unused images and build cache..."
              docker image prune -f
              docker builder prune -f --keep-storage 1GB || true
            elif command -v pm2 &> /dev/null; then
              echo "🚀 Deploying Backend via PM2..."
              cd dev-backend-mexpo-new
              npm install --production=false
              npx prisma migrate deploy
              npm run build
              pm2 restart backend-expo || pm2 start dist/src/main.js --name backend-expo
            else
              echo "⚠️ Neither Docker nor PM2 configuration matched."
            fi

            echo "🎉 Deployment completed successfully!"
