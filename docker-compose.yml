name: mexpo-platform

services:
  # ------------------------------------------------------------
  # Database Service (PostgreSQL 16)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mexpo-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-mexpo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mexpo_password_2026}
      POSTGRES_DB: ${DB_NAME:-mexpo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mexpo_user} -d ${DB_NAME:-mexpo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mexpo-network

  # ------------------------------------------------------------
  # Object Storage (MinIO S3 Compatible)
  # ------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: mexpo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mexpo-network

  # ------------------------------------------------------------
  # MinIO Bucket Initializer
  # Creates all application buckets and enables public download policy
  # ------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: mexpo-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb --ignore-existing myminio/expo-project;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-event;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-sponsor;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-speaker;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-tenant;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-product;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-transaction;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-certificate;
      /usr/bin/mc mb --ignore-existing myminio/expo-project-proof;
      /usr/bin/mc anonymous set download myminio/expo-project;
      /usr/bin/mc anonymous set download myminio/expo-project-event;
      /usr/bin/mc anonymous set download myminio/expo-project-sponsor;
      /usr/bin/mc anonymous set download myminio/expo-project-speaker;
      /usr/bin/mc anonymous set download myminio/expo-project-tenant;
      /usr/bin/mc anonymous set download myminio/expo-project-product;
      /usr/bin/mc anonymous set download myminio/expo-project-transaction;
      /usr/bin/mc anonymous set download myminio/expo-project-certificate;
      /usr/bin/mc anonymous set download myminio/expo-project-proof;
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "
    networks:
      - mexpo-network

  # ------------------------------------------------------------
  # Backend API (NestJS 11 + Prisma)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./dev-backend-mexpo-new
      dockerfile: Dockerfile
    container_name: mexpo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3500}:3500"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 3500
      NODE_ENV: ${NODE_ENV:-production}
      DB_PROVIDER: ${DB_PROVIDER:-postgresql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-mexpo_user}
      DB_PASSWORD: ${DB_PASSWORD:-mexpo_password_2026}
      DB_NAME: ${DB_NAME:-mexpo_db}
      DB_SSLMODE: ${DB_SSLMODE:-}
      JWT_SECRET: ${JWT_SECRET:-AyamGolek}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-bidinCaem}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-bidinGuruSMK}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3500}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-rama.ramajr125@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-esjj qbpv qfaz mjsd}
      CONTACT_DESTINATION_EMAIL: ${CONTACT_DESTINATION_EMAIL:-tefa@smktelkom-mlg.sch.id}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://localhost:9000}
      MINIO_ENDPOINT_UPLOAD: ${MINIO_ENDPOINT_UPLOAD:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-expo-project}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-dp6l7Q5hwsmvkWsP3-kOc7Jh}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-IiW5j-bppphCXvWE}
      MIDTRANS_IS_3DS: ${MIDTRANS_IS_3DS:-true}
      MIDTRANS_PAYMENT_EXPIRY: ${MIDTRANS_PAYMENT_EXPIRY:-1440}
      PAYMENT_PLATFORM_FEE_PERCENT: ${PAYMENT_PLATFORM_FEE_PERCENT:-5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-501093420723-o7hni0r5c48tmcvvqfnq94imutok4u7t.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}
      MEXPO_INTEGRATION_API_KEY: ${MEXPO_INTEGRATION_API_KEY:-MexpoKeren}
      MEXPO_WEBHOOK_SECRET: ${MEXPO_WEBHOOK_SECRET:-MexpoKeren}
    networks:
      - mexpo-network

  # ------------------------------------------------------------
  # Frontend Application (Next.js 16 + React 19)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./dev-frontend-mexpo-new
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL_DEVELOPMENT: ${NEXT_PUBLIC_BASE_URL_DEVELOPMENT:-http://backend:3500}
        NEXT_PUBLIC_BASE_URL_PRODUCTION: ${NEXT_PUBLIC_BASE_URL_PRODUCTION:-http://localhost:3500}
        NEXT_PUBLIC_BASIC_AUTH_USERNAME: ${NEXT_PUBLIC_BASIC_AUTH_USERNAME:-bidinCaem}
        NEXT_PUBLIC_BASIC_AUTH_PASSWORD: ${NEXT_PUBLIC_BASIC_AUTH_PASSWORD:-bidinGuruSMK}
        NEXT_PUBLIC_TOKEN_KEY: ${NEXT_PUBLIC_TOKEN_KEY:-mexpo-token}
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-SB-Mid-client-IiW5j-bppphCXvWE}
        NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: ${NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION:-false}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-501093420723-o7hni0r5c48tmcvvqfnq94imutok4u7t.apps.googleusercontent.com}
    container_name: mexpo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_BASE_URL_DEVELOPMENT: ${NEXT_PUBLIC_BASE_URL_DEVELOPMENT:-http://backend:3500}
      NEXT_PUBLIC_BASE_URL_PRODUCTION: ${NEXT_PUBLIC_BASE_URL_PRODUCTION:-http://localhost:3500}
      NEXT_PUBLIC_BASIC_AUTH_USERNAME: ${NEXT_PUBLIC_BASIC_AUTH_USERNAME:-bidinCaem}
      NEXT_PUBLIC_BASIC_AUTH_PASSWORD: ${NEXT_PUBLIC_BASIC_AUTH_PASSWORD:-bidinGuruSMK}
      NEXT_PUBLIC_TOKEN_KEY: ${NEXT_PUBLIC_TOKEN_KEY:-mexpo-token}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-SB-Mid-client-IiW5j-bppphCXvWE}
      NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: ${NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION:-false}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-501093420723-o7hni0r5c48tmcvvqfnq94imutok4u7t.apps.googleusercontent.com}
    networks:
      - mexpo-network

# ------------------------------------------------------------
# Networks & Volumes
# ------------------------------------------------------------
networks:
  mexpo-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
